version: "3.9"

# Infrastructure + AI agents service.
# Run the Spring Boot backend (mvn spring-boot:run) and React frontend
# (npm run dev) locally, or uncomment the backend/frontend services below.

services:
  postgres:
    image: postgres:16-alpine
    container_name: aicicd-postgres
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./agents/db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  agents:
    build: ./agents
    container_name: aicicd-agents
    env_file: .env
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      FALLBACK_GEMINI_API_KEY: ${FALLBACK_GEMINI_API_KEY:-}
      FALLBACK_LLM_MODEL: ${FALLBACK_LLM_MODEL:-gemini-3.5-flash}
      FALLBACK_LLM_BASE_URL: ${FALLBACK_LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
    ports:
      - "${AGENTS_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
