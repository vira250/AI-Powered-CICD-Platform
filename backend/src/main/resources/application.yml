server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cicddb}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Viraj@181105}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# GitHub App Configuration
github:
  app:
    id: "${GITHUB_APP_ID:4525940}"
    private-key-path: "${GITHUB_PRIVATE_KEY_PATH:classpath:github-private-key.pem}"
    webhook-secret: "${GITHUB_WEBHOOK_SECRET:}"
  client:
    id: "${GITHUB_CLIENT_ID:}"
    secret: "${GITHUB_CLIENT_SECRET:}"
  redirect:
    uri: "${GITHUB_REDIRECT_URI:http://localhost:5173/api/auth/github/callback}"
  oauth:
    scope: "${GITHUB_OAUTH_SCOPE:repo,workflow,user:email}"
  api:
    base-url: ${GITHUB_API_BASE_URL:https://api.github.com}

# Frontend URL for redirects after auth
app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5173}
  agents:
    url: ${AGENTS_URL:http://localhost:8001}
  repository-context:
    max-payload-bytes: ${MAX_REPOSITORY_CONTEXT_BYTES:5242880}
    include-secrets: ${INCLUDE_SECRETS_IN_CONTEXT:false}
  workflow-log-analysis:
    poll-interval-ms: ${WORKFLOW_LOG_ANALYSIS_POLL_INTERVAL_MS:5000}
    max-poll-attempts: ${WORKFLOW_LOG_ANALYSIS_MAX_POLL_ATTEMPTS:120}

logging:
  level:
    com.cicd: DEBUG
